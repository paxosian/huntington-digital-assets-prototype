<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huntington Digital Assets Demo</title>
<style>
:root{
  --g950:#06291a; --g900:#0a3d22; --g800:#0c5430; --g700:#0d6b37; --g500:#2e9e4f; --g100:#e3f3e8; --g50:#f1f9f3;
  --lime:#8cc63f; --ink:#14201a; --ink2:#33443b; --muted:#66766d; --line:#e2e8e4; --bg:#f3f6f4; --card:#fff;
  --p1:#2e9e4f; --p1b:#e3f3e8; --p2:#1f6fd1; --p2b:#e4eefb; --p3:#7446cf; --p3b:#efe8fb;
  --red:#c93c3c; --amber:#c98a12;
  --r:14px; --sh:0 1px 2px rgba(10,40,25,.06),0 4px 14px rgba(10,40,25,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--g950);color:#fff;display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--lime),var(--g500));display:grid;place-items:center;font-weight:800;color:var(--g950);font-size:15px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:#a9c7b4;font-size:11.5px;letter-spacing:.3px}
.phase-ctl{display:flex;align-items:center;gap:10px}
.phase-ctl .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#a9c7b4}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:12.5px;color:#cfe3d6;white-space:nowrap}
.seg button.on{background:#fff;color:var(--g950);font-weight:600}
.seg button .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

.nav{position:sticky;top:54px;z-index:25;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 20px;overflow-x:auto}
.nav button{padding:13px 14px;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.nav button.on{color:var(--g800);border-color:var(--g700);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:24px 20px 40px}
footer{max-width:1280px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:11.5px}

/* chips */
.pchip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:999px;vertical-align:middle}
.pchip.p1{background:var(--p1b);color:var(--p1)} .pchip.p2{background:var(--p2b);color:var(--p2)} .pchip.p3{background:var(--p3b);color:var(--p3)}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--g50);color:var(--g800);border:1px solid var(--g100);margin:2px 4px 2px 0}
.mut{color:var(--muted)}

/* locked */
.locked{position:relative}
.locked-inner{filter:grayscale(.7);opacity:.38;pointer-events:none;user-select:none}
.lock-tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);color:var(--ink2);display:flex;gap:6px;align-items:center;z-index:2}
.locked.full>.lock-tag{top:50%;left:50%;right:auto;transform:translate(-50%,-50%);padding:10px 16px;font-size:12.5px;text-align:center;flex-direction:column;gap:2px;border-radius:14px}

/* generic layout */
.story{background:linear-gradient(120deg,var(--g900),var(--g700));color:#fff;border-radius:18px;padding:24px 28px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin-bottom:20px}
.story h1{margin:0 0 6px;font-size:24px;letter-spacing:-.3px}
.story p{margin:0;color:#cfe6d7;max-width:640px}
.story .eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--lime);font-weight:700;margin-bottom:8px}
.story .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;align-self:start}
.story .stat b{font-size:26px;display:block;color:#fff}
.story .stat span{font-size:12.5px;color:#cfe6d7}
.story .pw{margin-top:12px}
.story .pw .tag{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#e6f3ea}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:2px} .kpi .d{font-size:12px;color:var(--g500);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;background:var(--g700);color:#fff}
.btn:hover{background:var(--g800)}
.btn.ghost{background:#fff;color:var(--g800);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.status{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.st-ok{background:var(--p1b);color:var(--g800)} .st-wait{background:#fdf3dd;color:#8a5d00} .st-hi{background:#fbe5e5;color:var(--red)} .st-blue{background:var(--p2b);color:var(--p2)}
.toggle{position:relative;width:38px;height:22px;border-radius:999px;background:#cfd8d3;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--g500)} .toggle.on::after{left:19px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border-bottom:0}
.set .t{font-weight:600;font-size:13px}.set .s{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--g700)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.segb{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.segb button{padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.segb button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;color:var(--muted)}
.steps li .dot{width:18px;height:18px;border-radius:50%;border:2px solid #cfd8d3;flex:none;margin-top:1px;display:grid;place-items:center;font-size:10px}
.steps li.done{color:var(--ink)} .steps li.done .dot{background:var(--g500);border-color:var(--g500);color:#fff}
.steps li.cur .dot{border-color:var(--g500);animation:pulse 1s infinite}
.steps li .ts{margin-left:auto;font-size:11.5px;color:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(46,158,79,.2)}}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--g500)}

/* overview */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-bottom:22px}
.hero h1{font-size:34px;line-height:1.1;letter-spacing:-.8px;margin:6px 0 10px;color:var(--g950)}
.hero p{color:var(--ink2);font-size:15px;margin:0 0 14px;max-width:620px}
.eyebrow2{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--g700);font-weight:700}
.phases{display:grid;gap:10px}
.ph{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer}
.ph.on{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.ph .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.ph b{display:block;font-size:13.5px}.ph span{font-size:12.5px;color:var(--muted)}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.matrix th{font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--ink2);border:0;padding:4px 6px;text-align:left;vertical-align:bottom}
.matrix th.seg-h{width:150px}
.matrix td{border:0;padding:0;vertical-align:top}
.cell{border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.35;height:100%;min-height:64px;cursor:pointer;border:1px solid transparent;transition:.15s}
.cell:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.cell .pc{font-size:9.5px;font-weight:800;letter-spacing:.5px;margin-bottom:3px;opacity:.9}
.cell.c1{background:var(--p1b);color:#185f31;border-color:#cde9d6}
.cell.c2{background:var(--p2b);color:#18518f;border-color:#cfe0f6}
.cell.c3{background:var(--p3b);color:#55309f;border-color:#e0d4f6}
.cell.off{background:#f6f7f6;color:#9aa59f;border:1px dashed #d6ddd9}
.seg-name{font-weight:700;font-size:13px;padding:10px 4px 0;cursor:pointer;color:var(--g900)}
.seg-name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.stack{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.stack .s{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.stack .s b{font-size:13px;display:block}.stack .s span{font-size:12px;color:var(--muted)}
.layer{border-radius:14px;padding:14px;text-align:center;font-weight:600;font-size:13px}

/* consumer */
.consumer{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
.phone-wrap{display:flex;justify-content:center;position:sticky;top:120px}
.phone{width:372px;height:760px;border-radius:52px;background:#0d1411;padding:12px;box-shadow:0 30px 60px rgba(6,41,26,.25),inset 0 0 0 2px #2a332e;position:relative}
.phone .inner{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#f6f8f7;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0d1411;border-radius:20px;z-index:12}
.sbar{display:flex;justify-content:space-between;padding:16px 28px 6px;font-size:12.5px;font-weight:600;flex:none}
.screen{flex:1;overflow-y:auto;padding:6px 16px 16px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 6px 22px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);position:relative;padding:2px 8px}
.tabbar button.on{color:var(--g700);font-weight:600}
.tabbar button .lk{position:absolute;top:-3px;right:2px;width:8px;height:8px;border-radius:50%}
.tabbar svg{width:22px;height:22px}
.c-hdr{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.c-hello{font-weight:700;font-size:17px}.c-sub{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.c-total{background:linear-gradient(135deg,var(--g900),var(--g700));color:#fff;border-radius:20px;padding:18px}
.c-total .lbl{font-size:12px;color:#bfe0cb}.c-total .big{font-size:30px;font-weight:700;letter-spacing:-.6px}
.c-total .up{font-size:12px;color:var(--lime)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--g800);position:relative}
.qa svg{width:20px;height:20px}
.acct{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.acct .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.acct .nm{font-weight:600;font-size:13px}.acct .ds{font-size:11.5px;color:var(--muted)}
.acct .am{margin-left:auto;text-align:right;font-weight:600;font-size:13.5px}
.earn{color:var(--g500);font-weight:600}
.promo{border-radius:14px;padding:13px 14px;margin:10px 0;font-size:12.5px;cursor:pointer;background:var(--p3b);color:#44247f;border:1px solid #e0d4f6}
.promo.blue{background:var(--p2b);color:#183f73;border-color:#cfe0f6}
.promo b{font-size:13.5px}
.sec-t{font-weight:700;font-size:13.5px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.act{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.act .ai{width:30px;height:30px;border-radius:50%;background:var(--g50);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--g800);flex:none}
.act .am{margin-left:auto;font-weight:600}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:none}
.alist .acct .am small{display:block;font-weight:500;font-size:11.5px}
.up-t{color:var(--g500)}.dn-t{color:var(--red)}
.back{font-size:13px;color:var(--g700);font-weight:600;margin:4px 0 8px}
.sheet-bg{position:absolute;inset:0;background:rgba(6,20,12,.35);z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:14px 18px 28px;max-height:88%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:4px;background:#d6ddd9;border-radius:9px;margin:0 auto 12px}
.sheet h4{margin:0 0 12px;font-size:16px}
.amt-in{font-size:34px;font-weight:700;border:0;width:100%;text-align:center;outline:0;letter-spacing:-.5px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600}
.chips button.on{background:var(--g700);color:#fff;border-color:var(--g700)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.ok-big{width:64px;height:64px;border-radius:50%;background:var(--g500);display:grid;place-items:center;margin:8px auto 10px;color:#fff;font-size:30px}
.center{text-align:center}
.speed{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.speed .ln{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.speed .ln span:first-child{width:96px;color:var(--muted)}
.speed .ln .bar{flex:1}
.ccard{border-radius:18px;padding:18px;color:#fff;height:190px;background:radial-gradient(circle at 85% 15%,rgba(140,198,63,.55),transparent 45%),linear-gradient(135deg,#0a3d22,#0d6b37 60%,#2e9e4f);position:relative;box-shadow:0 12px 24px rgba(6,41,26,.25)}
.ccard.frozen{filter:grayscale(1) brightness(.9)}
.ccard .nm{font-weight:800;font-size:16px;letter-spacing:.3px}
.ccard .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e8d38b,#b8962e);margin-top:26px}
.ccard .pan{font-size:16px;letter-spacing:2px;margin-top:14px}
.ccard .bt{position:absolute;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;opacity:.9}
.meter{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,#cdeed7 0 50%,#fdf0cf 50% 65%,#fbdada 65% 100%);margin:18px 0 22px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--g700);transition:width .15s}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:#33443b}
.meter .mk span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:9.5px;white-space:nowrap;color:var(--muted)}

/* narrative */
.narr{display:flex;flex-direction:column;gap:14px}
.narr .eyebrow2{margin-bottom:-6px}
.narr h2{margin:0;font-size:26px;letter-spacing:-.5px;color:var(--g950);line-height:1.15}
.narr p.lead{margin:0;color:var(--ink2);font-size:15px}
.narr ul{margin:0;padding-left:18px;color:var(--ink2)}
.narr ul li{margin:4px 0}
.bigstat{border-left:4px solid var(--lime);padding:6px 0 6px 14px}
.bigstat b{font-size:28px;color:var(--g900);display:block;letter-spacing:-.5px}
.bigstat span{color:var(--muted);font-size:13px}
.jump{display:flex;gap:8px;flex-wrap:wrap}
.jump button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--g800)}
.jump button.on{background:var(--g700);color:#fff;border-color:var(--g700)}

.donut-wrap{display:flex;gap:18px;align-items:center}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;padding-left:14px}
.arch{display:grid;grid-template-columns:1fr auto 1fr auto 1.4fr;gap:8px;align-items:center}
.arch .col{display:flex;flex-direction:column;gap:6px}
.arch .bx{border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;text-align:center}
.arch .arrow{color:var(--muted);font-size:18px}
.revbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.revbar .nm{width:190px;flex:none}
.revbar .bar{flex:1;height:14px}
.revbar .v{width:70px;text-align:right;font-weight:600}
.gauge{height:16px;border-radius:999px;background:var(--bg);position:relative;overflow:hidden;margin:12px 0 6px}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--g500);border-radius:999px;transition:width .4s}
.gauge .tg{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}

.tabbar button{padding:2px 4px}
.chart{position:relative;margin:8px -4px 0;cursor:crosshair}
.chart svg{display:block}
.chips.per button{padding:5px 10px}
.unit{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--g700);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 auto}
.amt-wrap{text-align:center}
.amt-sub{font-size:13px;color:var(--muted);margin-top:2px}
.qr{display:block;margin:10px auto;border:8px solid #fff;box-shadow:var(--sh);border-radius:8px}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--bg);border-radius:8px;padding:8px;word-break:break-all;text-align:center}
.cmp td,.cmp th{font-size:12.5px}
.cmp td:first-child{color:var(--muted)}
.ccard.credit{background:radial-gradient(circle at 85% 15%,rgba(247,147,26,.45),transparent 45%),linear-gradient(135deg,#111a15,#26332c 60%,#3b4a41)}
.facts .kv{font-size:13px;padding:9px 0}
.lockchip{opacity:.5}

function chartSvg(sym,per,w=320,h=130){
  const {pts}=periodPts(sym,per),mn=Math.min(...pts),mx=Math.max(...pts),up=pts[pts.length-1]>=pts[0],col=up?'#2e9e4f':'#c93c3c';

  const d=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<div class="chart" data-chart="${sym}" data-per="${per}"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><defs><linearGradient id="g${sym}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w},${h} L0,${h}Z" fill="url(#g${sym})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="chL" x1="0" x2="0" y1="0" y2="${h}" stroke="#8a978f" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" style="display:none"/></svg></div>`;

function donut(parts,size=150){
  const tot=parts.reduce((s,p)=>s+p.v,0),r=56,C=2*Math.PI*r;let off=0;

}
function qr(seed,size=150){const r=rng(seed.split('').reduce((s,c)=>s*33+c.charCodeAt(0),5)),n=25,c=size/n;let o='';
  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#14201a"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#14201a"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r()>.52)o+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#14201a"/>`}
  return `<svg class="qr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/>${o}${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg>`}

function feeOf(sym,gross){return TOK[sym]?0:Math.max(.99,Math.round(gross*.01*100)/100)}
function tradeCalc(){
  const tr=S.c.trade,p=ALL[tr.sym].p,a=parseFloat(tr.amt)||0;let qty,gross,fee,total;
  if(tr.side==='buy'){
    if(tr.unit==='usd'){total=a;fee=feeOf(tr.sym,a);gross=Math.max(0,a-fee);qty=gross/p}
    else{qty=a;gross=qty*p;fee=feeOf(tr.sym,gross);total=gross+fee}
  }else{
    if(tr.unit==='usd'){gross=a;qty=a/p}else{qty=a;gross=qty*p}
    fee=feeOf(tr.sym,gross);total=gross-fee;
  }
  const bad=a<=0||(tr.side==='buy'?total>S.bal.checking+1e-9:qty>S.hold[tr.sym]+1e-9);
  return {p,qty,gross,fee,total,bad,a};
}

function addAct(t,s,a,i){S.act.unshift({t,s,a,i})}
function run(steps,obj,key,done,delay=850,start=1){obj[key]=start;render();const tick=()=>{if(obj[key]<steps){obj[key]++;render();setTimeout(tick,delay)}else if(done)done()};setTimeout(tick,delay)}
const trimQ=(q,s)=>String(+q.toFixed(dec(s)));

const A={
  phase:v=>{S.phase=+v},

  goto:v=>{const[vw,tab,sub]=v.split(':');S.view=vw;if(tab){S.c.tab=tab;S.c.asset=null;S.c.sheet=null;if(tab==='card')S.c.card.mode=sub||'debit'}window.scrollTo({top:0})},

  trade:v=>{const[sd,sym]=v.split(':');Object.assign(S.c.trade,sd==='sell'&&!TOK[sym]?{side:'sell',sym,unit:'coin',amt:trimQ(S.hold[sym]*.25,sym),step:'edit'}:{side:sd,sym,unit:'usd',amt:sd==='sell'?String(Math.floor(S.hold[sym]*ALL[sym].p*.25)):'250',step:'edit'});S.c.sheet='trade'},
  close:()=>{S.c.sheet=null},
  bgclose:()=>{S.c.sheet=null},
  tside:v=>{const tr=S.c.trade;tr.side=v;tr.step='edit';if(v==='sell'&&!TOK[tr.sym]){tr.unit='coin';tr.amt=trimQ(S.hold[tr.sym]*.25,tr.sym)}else{tr.unit='usd';tr.amt='250'}},
  tsym:v=>{const tr=S.c.trade;tr.sym=v;if(tr.unit==='coin')tr.amt=trimQ(S.hold[v]*.25,v)},
  tamt:v=>{S.c.trade.unit='usd';S.c.trade.amt=v},
  tfrac:v=>{const tr=S.c.trade;tr.unit='coin';tr.amt=+v===1?String(S.hold[tr.sym]):trimQ(S.hold[tr.sym]*v,tr.sym)},
  tunit:()=>{const tr=S.c.trade,R=tradeCalc();if(tr.unit==='usd'){tr.unit='coin';tr.amt=trimQ(R.qty,tr.sym)}else{tr.unit='usd';tr.amt=(tr.side==='buy'?R.total:R.gross).toFixed(2)}},
  treview:()=>{S.c.trade.step='review'},
  tedit:()=>{S.c.trade.step='edit'},

    else{S.hold[tr.sym]=Math.max(0,S.hold[tr.sym]-R.qty);if(S.hold[tr.sym]<1e-9)S.hold[tr.sym]=0;S.bal.checking+=R.total;addAct('Sold '+A_.name,'Just now · Invest','+'+fm(R.total),tr.sym.slice(0,3))}
    tr.res={side:tr.side,qty:R.qty,p:R.p,gross:R.gross,fee:R.fee,total:R.total,id:String(Math.floor(1e7+Math.random()*9e7))};tr.step='done'},
  sendto:v=>{const c=CONTACTS[+v];if(c.p>S.phase){toast('External wallets come in Phase 2. Phase 1 is Huntington customers only.');return}S.c.sheet='send';Object.assign(S.c.send,{to:+v,step:'amt'})},
  sendasset:v=>{S.c.sheet='send';Object.assign(S.c.send,{step:'pick',asset:v,amt:'50'})},
  recvasset:v=>{S.c.sheet='recv';Object.assign(S.c.recv,{mode:'chain',asset:v})},
  sasset:v=>{S.c.send.asset=v},
  samt:v=>{S.c.send.amt=v},
  sendgo:()=>{const sd=S.c.send,c=CONTACTS[sd.to],amt=+sd.amt,fee=c.ext?NETFEE[sd.asset]:0;

  rmode:v=>{S.c.recv.mode=v},rasset:v=>{S.c.recv.asset=v},rnet:v=>{S.c.recv.net=v},

  addgo:()=>{const a=+S.c.add.amt,k=S.c.add.coin.toLowerCase();S.bal.checking-=a;S.bal[k]+=a;addAct('Added '+S.c.add.coin,'Just now · '+S.c.add.coin,'+'+fm(a),'$');S.c.add.step='done'},
  usdc2usdg:()=>{if(S.bal.usdc<=0)return;S.bal.usdg+=S.bal.usdc;toast(fm(S.bal.usdc)+' USDC converted to USDG 1:1');S.bal.usdc=0},
  stake:v=>{S.c.stake[v]=!S.c.stake[v];toast(S.c.stake[v]?v+' staked':v+' unstaked')},
  auto:()=>{S.c.auto=!S.c.auto},
  card:v=>{S.c.card[v]=!S.c.card[v];if(v==='frozen')toast(S.c.card.frozen?'Card frozen':'Card unfrozen')},
  cmode:v=>{S.c.card.mode=v},crew:v=>{S.c.card.rew=v},
  cpay:()=>{const c=S.c.card;S.bal.checking-=c.cbal;addAct('Crypto Credit payment','Just now · Checking',fm(-c.cbal),'CC');toast('Paid '+fm(c.cbal));c.cbal=0},
  csrc:v=>{S.c.card.src=v},
  virt:()=>{S.c.card.virt.push({n:'One-time card',l4:String(1000+Math.floor(Math.random()*8999)),d:'expires after 1 use'});toast('Virtual card created')},
  agent:()=>{S.c.agent=!S.c.agent},
  bdest:v=>{S.c.borrow.dest=v},
  draw:()=>{const b=S.c.borrow;b.drawn+=b.amt;b.last=b.amt;if(b.dest==='usdg')S.bal.usdg+=b.amt;else S.bal.checking+=b.amt;addAct('Credit line draw','Just now · Borrow','+'+fm(b.amt),'LOC');S.c.sheet='draw'},
  wstake:()=>{S.w.stake=!S.w.stake},
  wpledge:()=>{S.w.pledged=true;toast('Pledged line opened')},
  wdep:()=>{S.w.dep.open=!S.w.dep.open;if(S.w.dep.open&&S.phase<2)toast('Deposits from external wallets arrive in Phase 2')},
  wdepasset:v=>{if(S.w.dep.step>1&&S.w.dep.step<6)return;S.w.dep.asset=v;S.w.dep.step=0},
  wdepaddr:()=>{S.w.dep.step=1},
  wdepsim:()=>{const d=S.w.dep;if(d.step>=6)return;run(6,d,'step',()=>{if(d.asset==='BTC')S.w.btc+=.75;else if(d.asset==='ETH')S.w.eth+=12;render();toast('Held-away assets now in Huntington custody')},900,2)},
  brule:()=>{S.b.rule=!S.b.rule},
  bpay:()=>{const p=S.b.pay;if(p.step>=4){p.step=0;render();return}run(4,p,'step',()=>toast('Payment settled'))},
  bcard:()=>{S.b.cards.push({n:'New vendor card',l:1500,u:0});toast('Virtual card issued with MCC & velocity controls')},
  tmode:v=>{S.t.mode=v;S.t.step=0},
  tgo:()=>{const amt=(+S.t.amt||0)/1e6,m=S.t.mode;run(4,S.t,'step',()=>{S.t.usdg=Math.max(0,S.t.usdg+(m==='mint'?amt:-amt));render();toast(m==='mint'?'USDG minted and delivered':'USD credited to DDA')})},
  release:()=>{S.t.released=true;toast('5 payouts settled ($5.81M)')},
  tprog:()=>{S.t.prog=!S.t.prog},
  tsweep:()=>{S.t.sweep=!S.t.sweep},
  tdmint:()=>{const td=S.t.td,a=(+td.mint||0)/1e6;if(a<=0||a>td.dda){toast('Amount exceeds DDA balance');return}td.dda-=a;td.tok+=a;toast(fm0(a*1e6)+' moved to deposit tokens')},
  tdroute:v=>{S.t.td.route=v;S.t.td.step=0},
  tdpay:()=>{const td=S.t.td;if(td.step>=4){td.step=0;render();return}const a=(+td.amt||0)/1e6;run(4,td,'step',()=>{td.tok=Math.max(0,td.tok-a);render();toast('Payment settled')})},
  topup:v=>{S.o.float=Math.round((S.o.float+1)*10)/10;toast('$1,000,000 sent via '+v+'')},
  alert:v=>{S.o.alerts[v].st='Cleared';toast(S.o.alerts[v].id+' cleared and logged')},
  allow:v=>{S.o.allow[v]=!S.o.allow[v]},
  ostake:()=>{S.o.stake=!S.o.stake},
  ocard:()=>{S.o.card=!S.o.card},
  toast:v=>{toast(v)}
};
const NORENDER=new Set(['toast','bpay','tgo','tdpay','wdepsim']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a;
  if(a==='bgclose'&&e.target!==el)return;
  if(!A[a])return;
  A[a](el.dataset.v,el,e);
  if(!NORENDER.has(a))render();
});
const num=v=>v.replace(/[^0-9.]/g,'');
const IN={
  climit:v=>{S.c.card.limit=+v},bamt:v=>{S.c.borrow.amt=+v},walloc:v=>{S.w.alloc=+v},bkeep:v=>{S.b.keep=+v},
  tamt:v=>{S.c.trade.amt=num(v)},samt:v=>{S.c.send.amt=num(v)},aamt:v=>{S.c.add.amt=num(v)},
  bvendor:v=>{S.b.pay.v=+v},bamt2:v=>{S.b.pay.amt=num(v)},tamt2:v=>{S.t.amt=num(v)},tdmint:v=>{S.t.td.mint=num(v)},tdamt:v=>{S.t.td.amt=num(v)}
};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||!IN[k])return;IN[k](e.target.value);if(e.target.type==='range')live()});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||!IN[k])return;IN[k](e.target.value);render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.in)e.target.blur()});
/* chart hover: scrub price like retail trading apps */
function chartHover(e,leave){
  const ch=e.target.closest&&e.target.closest('[data-chart]');if(!ch)return;
  const sym=ch.dataset.chart,per=ch.dataset.per,{pts,step}=periodPts(sym,per),pr=document.getElementById('chPrice'),dl=document.getElementById('chDelta'),ln=ch.querySelector('#chL');
  if(leave){render();return}
  const rect=ch.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left,i=Math.max(0,Math.min(pts.length-1,Math.round(x/rect.width*(pts.length-1))));
  const v=pts[i],ch0=(v/pts[0]-1)*100,when=new Date(TODAY.getTime()-(pts.length-1-i)*step);
  pr.textContent=fm(v);dl.className=ch0>=0?'up-t':'dn-t';dl.textContent=`${ch0>=0?'▲':'▼'} ${pct(ch0)} · ${fmtDate(when,per)}`;
  ln.style.display='';const X=i/(pts.length-1)*320;ln.setAttribute('x1',X);ln.setAttribute('x2',X);
}
document.addEventListener('mousemove',e=>chartHover(e));
document.addEventListener('touchmove',e=>chartHover(e),{passive:true});
document.addEventListener('mouseout',e=>{const ch=e.target.closest&&e.target.closest('[data-chart]');if(ch&&!ch.contains(e.relatedTarget))chartHover(e,true)});
render();

</script>
